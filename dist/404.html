<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Nora Studio</title>
    <meta name="description" content="The requested page does not exist on Nora Studio.">
    <link rel="icon" type="image/png" href="nora.png">
    
    <!-- Typography & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-base: #080A10;
            --bg-surface: #0E111D;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(88, 101, 242, 0.4);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --blurple: #5865F2;
            --blurple-hover: #4752C4;
            --blurple-glow: rgba(88, 101, 242, 0.35);
            --radius-md: 14px;
            --radius-lg: 24px;
            --radius-full: 9999px;
            --transition-smooth: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 24px;
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(88, 101, 242, 0.2) 0%, transparent 65%),
                radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 28px 28px;
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        .error-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 50px 36px;
            text-align: center;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(88, 101, 242, 0.15);
            animation: floatUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            backdrop-filter: blur(20px);
        }

        @keyframes floatUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .code {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(5rem, 12vw, 6.5rem);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #FFFFFF 0%, #818CF8 60%, var(--blurple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            letter-spacing: -3px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: #FFFFFF;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 28px;
            font-size: 0.96rem;
        }

        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-primary {
            padding: 13px 28px;
            border-radius: var(--radius-full);
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-decoration: none;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--blurple);
            color: #FFFFFF;
            box-shadow: 0 4px 18px var(--blurple-glow);
        }
        .btn-primary:hover {
            background: var(--blurple-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--blurple-glow);
        }

        .quick-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 14px;
        }
        .quick-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .quick-nav a:hover {
            color: #FFFFFF;
        }

        .countdown {
            margin-top: 24px;
            font-size: 0.82rem;
            color: var(--text-muted);
            padding-top: 16px;
            border-top: 1px solid var(--border-subtle);
        }
        .countdown span {
            color: #FFFFFF;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        @media (max-width: 600px) {
            body { padding: 16px; }
            .error-card { padding: 36px 20px; border-radius: 20px; }
            h1 { font-size: 1.5rem; }
            p { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="code">404</div>
        <h1>Off the Telemetry Grid</h1>
        <p>The coordinates you requested do not exist or have been relocated within Nora's mainframe network.</p>
        
        <div class="actions-group">
            <a href="/" class="btn-primary"><i class="fas fa-house"></i> Return to Homepage</a>
            <div class="quick-nav">
                <a href="/docs"><i class="fas fa-book"></i> Docs</a>
                <a href="/dashboard"><i class="fas fa-sliders-h"></i> Dashboard</a>
                <a href="/status"><i class="fas fa-chart-line"></i> Status</a>
                <a href="/support"><i class="fas fa-headset"></i> Support</a>
                <a href="/team"><i class="fas fa-users"></i> Team</a>
            </div>
        </div>

        <div class="countdown">
            Auto-routing home in <span id="secs">10</span> seconds...
        </div>
    </div>

    <script>
        let seconds = 10;
        const countdownEl = document.getElementById('secs');
        const interval = setInterval(() => {
            seconds--;
            if (countdownEl) countdownEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = "/";
            }
        }, 1000);
    </script>
</body>
</html>
